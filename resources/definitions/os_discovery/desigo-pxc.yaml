modules:
    os:
        hardware: '.1.3.6.1.4.1.4329.6.3.2.1.1.2.0'
        serial: '.1.3.6.1.4.1.4329.6.3.2.1.1.3.0'
        version: '.1.3.6.1.4.1.4329.6.3.2.1.1.5.0'
    sensors:
        state:
            data:
                -
                    oid: AUTOMATION-SYSTEM-MIB::automationOperState
                    num_oid: '.1.3.6.1.4.1.4329.6.3.2.1.2.1.{{ $index }}'
                    descr: 'Operational State'
                    group: System
                    state_name: automationOperState
                    states:
                        - { value: 0, generic: 0, graph: 1, descr: 'ok' }
                        - { value: 1, generic: 1, graph: 1, descr: 'maintenanceRequired' }
                        - { value: 2, generic: 1, graph: 1, descr: 'maintenanceDemanded' }
                        - { value: 3, generic: 2, graph: 1, descr: 'fault' }
                -
                    oid: AUTOMATION-SYSTEM-MIB::automationApplicationOperState
                    num_oid: '.1.3.6.1.4.1.4329.6.3.2.1.2.2.{{ $index }}'
                    descr: 'Application State'
                    group: System
                    state_name: automationApplicationOperState
                    states:
                        - { value: 1, generic: 1, graph: 1, descr: 'noControl' }
                        - { value: 2, generic: 0, graph: 1, descr: 'run' }
                        - { value: 3, generic: 2, graph: 1, descr: 'stop' }
